<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Abstract concept cover — neighbourhood café">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9ddce"/>
      <stop offset="100%" stop-color="#d9c3ab"/>
    </linearGradient>
    <radialGradient id="c-warm" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f5d9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5d9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="100%" stop-color="#e5d7c0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#c-bg)"/>
  <rect width="800" height="600" fill="url(#c-warm)"/>
  <!-- table -->
  <rect x="0" y="420" width="800" height="180" fill="#b98f66"/>
  <rect x="0" y="420" width="800" height="10" fill="#a67c55"/>
  <!-- cup + saucer -->
  <ellipse cx="400" cy="470" rx="150" ry="22" fill="#f1e7d6"/>
  <path d="M320 340 h160 v70 q0 60 -80 60 q-80 0 -80 -60 z" fill="url(#c-cup)"/>
  <path d="M480 360 q60 6 52 44 q-8 34 -56 26" fill="none" stroke="#e5d7c0" stroke-width="14"/>
  <ellipse cx="400" cy="344" rx="80" ry="14" fill="#8a5a33"/>
  <ellipse cx="400" cy="340" rx="80" ry="13" fill="#6f4525"/>
  <!-- steam -->
  <path d="M370 300 q-12 -30 4 -52 q14 -20 4 -44" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M420 306 q-10 -26 5 -46 q13 -18 5 -40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- menu card -->
  <rect x="580" y="250" width="130" height="170" rx="6" fill="#f7f1e5" transform="rotate(4 645 335)"/>
  <rect x="600" y="280" width="90" height="6" fill="#8a5a33" transform="rotate(4 645 335)"/>
  <rect x="600" y="300" width="70" height="4" fill="#c9b091" transform="rotate(4 645 335)"/>
  <rect x="600" y="316" width="82" height="4" fill="#c9b091" transform="rotate(4 645 335)"/>
  <rect x="600" y="332" width="60" height="4" fill="#c9b091" transform="rotate(4 645 335)"/>
  <!-- cobalt accent -->
  <circle cx="120" cy="120" r="8" fill="#1f3be0"/>
  <rect x="600" y="376" width="44" height="3" fill="#1f3be0" opacity="0.8" transform="rotate(4 645 335)"/>
</svg>

name = "thomas-nicoli"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]

[vars]
# Local defaults fail closed. Preview and production overrides are explicit below.
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAD8a4H-XHfBfZQxo"
NEXT_PUBLIC_PROJECT_CLARITY_LEGAL_READY = "false"
PROJECT_CLARITY_SUBMISSIONS_ENABLED = "false"
PROJECT_CLARITY_LEGAL_APPROVED = "false"
NEXT_PUBLIC_CHATBOT_ENABLED = "false"
CHATBOT_ENABLED = "false"


# Local development persists this binding locally unless --remote is used.
[[d1_databases]]
binding = "PROJECT_CLARITY_DB"
database_name = "project-clarity-preview"
database_id = "12884390-e178-4cff-a336-88b63007a81f"
preview_database_id = "12884390-e178-4cff-a336-88b63007a81f"
migrations_dir = "migrations"

[env.preview.vars]
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAD8a4H-XHfBfZQxo"
NEXT_PUBLIC_PROJECT_CLARITY_LEGAL_READY = "true"
NEXT_PUBLIC_PROJECT_CLARITY_CONSENT_VERSION = "2026-07-24-v1"
PROJECT_CLARITY_SUBMISSIONS_ENABLED = "true"
PROJECT_CLARITY_LEGAL_APPROVED = "true"
PROJECT_CLARITY_CONSENT_VERSION = "2026-07-24-v1"
PROJECT_CLARITY_RETENTION_DAYS = "30"
NEXT_PUBLIC_CHATBOT_ENABLED = "true"
CHATBOT_ENABLED = "true"


[[env.preview.d1_databases]]
binding = "PROJECT_CLARITY_DB"
database_name = "project-clarity-preview"
database_id = "12884390-e178-4cff-a336-88b63007a81f"
migrations_dir = "migrations"

[env.production.vars]
# Owner-requested activation. The public copy states the provisional 30-day policy.
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAD8a4H-XHfBfZQxo"
NEXT_PUBLIC_PROJECT_CLARITY_LEGAL_READY = "true"
NEXT_PUBLIC_PROJECT_CLARITY_CONSENT_VERSION = "2026-07-24-v1"
PROJECT_CLARITY_SUBMISSIONS_ENABLED = "true"
PROJECT_CLARITY_LEGAL_APPROVED = "true"
PROJECT_CLARITY_CONSENT_VERSION = "2026-07-24-v1"
PROJECT_CLARITY_RETENTION_DAYS = "30"
NEXT_PUBLIC_CHATBOT_ENABLED = "true"
CHATBOT_ENABLED = "true"


[[env.production.d1_databases]]
binding = "PROJECT_CLARITY_DB"
database_name = "project-clarity-production"
database_id = "cefa7a29-ec29-4a12-b6eb-5e94b5ba55c5"
migrations_dir = "migrations"
